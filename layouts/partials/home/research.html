<section id="research" class="max-w-6xl mx-auto py-20 px-6">

  <h2 class="text-4xl font-bold text-center mb-16">
    {{ if eq .Site.Language.Lang "el" }}Ερευνητικές Περιοχές{{ else }}Research Areas{{ end }}
  </h2>

  {{ with .Site.GetPage "/areas" }}
    <div class="grid gap-x-10 md:grid-cols-2">
      {{ range .RegularPages.ByWeight }}
        <article class="py-6 border-b border-neutral-200 dark:border-neutral-700">
          <h3 class="text-2xl font-semibold">
            <a href="{{ .RelPermalink }}" class="hover:underline">
              {{ .Title }}
            </a>
          </h3>
          {{ with .Params.description }}
            <p class="mt-2 text-neutral-600 dark:text-neutral-400">
              {{ . }}
            </p>
          {{ end }}
        </article>
      {{ end }}
    </div>
  {{ end }}

</section>
